# Reference config for mf-router (OpenResty / nginx) — NOT applied on mf-yats-1.
# TLS is terminated here; requests are proxied to the 3 gunicorn instances on
# mf-yats-1 over the Hetzner private network.
#
# mf-yats-1 private IP = 10.150.20.7. Ports: mf=8001, bagarino=8002,
# schiwago=8003 (see /etc/yats/<site>.env on the server).

upstream yats_mf       { server 10.150.20.7:8001; keepalive 16; }
upstream yats_bagarino { server 10.150.20.7:8002; keepalive 16; }
upstream yats_schiwago { server 10.150.20.7:8003; keepalive 16; }

# Shared proxy settings (include inside each server{} location)
# proxy_set_header Host              $host;
# proxy_set_header X-Real-IP         $remote_addr;
# proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# proxy_set_header X-Forwarded-Proto $scheme;   # settings: SECURE_PROXY_SSL_HEADER
# proxy_http_version 1.1;
# proxy_set_header Connection "";

server {
    listen 443 ssl;
    http2 on;
    server_name mf.mediafactory.de;
    # ssl_certificate ...; ssl_certificate_key ...;   # existing mf-router TLS

    client_max_body_size 2048m;          # large attachments (see FILE_UPLOAD_MAX_MEMORY_SIZE)

    location / {
        proxy_pass http://yats_mf;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # CalDAV uses PROPFIND/REPORT/PUT/etc — OpenResty/nginx proxies any method
        # to the upstream by default, so /tickets/dav/ works without extra config.
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bagarino.mediafactory.de;
    client_max_body_size 2048m;
    location / {
        proxy_pass http://yats_bagarino;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name schiwago.mediafactory.de;
    client_max_body_size 2048m;
    location / {
        proxy_pass http://yats_schiwago;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }
}
