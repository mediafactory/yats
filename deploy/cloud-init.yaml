#cloud-config
# Hetzner Cloud server "mf-yats-1" (mediafactory project) — base provisioning for
# the YATS app server that takes over mf / bagarino / schiwago.
# Target OS: Debian 13 (trixie), system Python 3.13.
#
# Before launch, fill the two placeholders below: SSH key and MF_ROUTER_IP.
# Attach the server to the Hetzner Private Network at create time (so it can
# reach the PostgreSQL cluster and be reached by mf-router).
#
# NOTE on networking: Hetzner private networks push NO default route and NO DNS.
# The cleanest permanent fix is to add a route 0.0.0.0/0 -> 10.150.20.1 to the
# Hetzner Cloud *network* (then DHCP pushes it). The write_files/runcmd below are
# the server-side fallback (DNS via resolvconf + a retrying default-route unit).

hostname: mf-yats-1
fqdn: mf-yats-1.mediafactory.de
prefer_fqdn_over_hostname: true
manage_etc_hosts: true
timezone: Europe/Berlin
locale: de_DE.UTF-8

package_update: true
package_upgrade: true

users:
  - name: admin
    groups: [sudo]
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - "ssh-ed25519 AAAA...REPLACE_WITH_YOUR_PUBLIC_KEY... admin@mediafactory"

packages:
  - git
  - curl
  - rsync
  - ufw
  - python3
  - python3-venv
  - python3-dev
  - build-essential
  - libpq-dev
  - postgresql-client
  - memcached
  - clamav
  - clamav-daemon
  - python3-xapian          # native Xapian bindings (xapian-haystack itself comes via pip)
  - libxapian-dev
  - imagemagick
  - libmagickwand-dev
  - ffmpeg
  - libreoffice
  - gettext
  - openjdk-21-jre-headless  # signal-cli (native build needs no JRE, but harmless to have)

write_files:
  # Placeholder for the mf-router IP that may reach the gunicorn ports.
  - path: /etc/yats-deploy.env
    permissions: "0600"
    content: |
      # IP of mf-router (OpenResty) — only host allowed to reach gunicorn 8001-8003.
      MF_ROUTER_IP=REPLACE_WITH_MF_ROUTER_PRIVATE_IP

  # --- Network persistence (Hetzner private net pushes no default route + no DNS) ---
  # DNS resolvers (resolvconf regenerates /etc/resolv.conf from this on every boot)
  - path: /etc/resolvconf/resolv.conf.d/base
    content: |
      nameserver 185.12.64.1
      nameserver 185.12.64.2
      nameserver 1.1.1.1
  # Default route: the IP is a /32, so add it only after DHCP installed the
  # on-link route to the gateway — retry to handle boot timing.
  - path: /usr/local/sbin/yats-default-route.sh
    permissions: "0755"
    content: |
      #!/bin/sh
      GW="${YATS_GATEWAY:-10.150.20.1}"
      for i in $(seq 1 60); do
          ip route replace default via "$GW" 2>/dev/null && exit 0
          sleep 2
      done
      echo "could not set default route via $GW" >&2
      exit 1
  - path: /etc/systemd/system/yats-default-route.service
    content: |
      [Unit]
      Description=Set yats default route (Hetzner private-network gateway)
      After=network.target
      Wants=network.target
      [Service]
      Type=oneshot
      RemainAfterExit=yes
      ExecStart=/usr/local/sbin/yats-default-route.sh
      Restart=on-failure
      RestartSec=5
      [Install]
      WantedBy=multi-user.target

runcmd:
  # Bring up DNS + default route FIRST — apt/git below need outbound internet.
  - resolvconf -u || true
  - systemctl daemon-reload
  - systemctl enable --now yats-default-route.service
  # wait until outbound name resolution works before touching apt
  - for i in $(seq 1 30); do getent hosts deb.debian.org >/dev/null 2>&1 && break; sleep 2; done

  # ClamAV: TCP socket for pyclamd, then refresh DB + enable
  - sed -i '/^TCPSocket/d;/^TCPAddr/d' /etc/clamav/clamd.conf
  - printf 'TCPSocket 3310\nTCPAddr 127.0.0.1\n' >> /etc/clamav/clamd.conf
  - systemctl stop clamav-freshclam || true
  - freshclam || true
  - systemctl enable --now clamav-freshclam clamav-daemon || true
  - systemctl enable --now memcached

  # ImageMagick: allow reading PDFs (needed for attachment previews via Wand).
  # Handles both ImageMagick-6 and -7 policy paths.
  - "for p in /etc/ImageMagick-6/policy.xml /etc/ImageMagick-7/policy.xml; do [ -f \"$p\" ] && sed -i 's/.*rights=\"none\" pattern=\"PDF\".*/  <policy domain=\"coder\" rights=\"read|write\" pattern=\"PDF\" \\/>/' \"$p\"; done || true"

  # Firewall: deny inbound except SSH (anywhere) and gunicorn 8001-8003 (mf-router only)
  - . /etc/yats-deploy.env
  - ufw --force reset
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow 22/tcp
  - ufw allow from ${MF_ROUTER_IP} to any port 8001:8003 proto tcp
  - ufw --force enable

  # Detect the Hetzner private IP (RFC1918, non-public) for gunicorn bind
  - PRIV=$(ip -4 -o addr show scope global | awk '{print $4}' | cut -d/ -f1 | grep -E '^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)' | head -1)
  - test -n "$PRIV" || (echo "no private IP found — attach the private network" >&2; exit 1)

  # Install the application
  - git clone --branch develop https://github.com/mediafactory/yats.git /opt/yats
  - PRIVATE_IP="$PRIV" bash /opt/yats/deploy/bootstrap.sh

final_message: >
  mf-yats-1 ready. Next: fill /etc/yats/<site>.ini (DB cluster creds + signal
  number), register signal numbers (deploy/signal/register.md), then run the
  cutover (deploy/MIGRATION.md). Bind IP for mf-router upstreams: the detected
  private IP, ports 8001 (mf) / 8002 (bagarino) / 8003 (schiwago).
