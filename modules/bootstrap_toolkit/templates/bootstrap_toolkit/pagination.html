{% with bootstrap_pagination_url=bootstrap_pagination_url|default:"?" %}
<nav class="flex justify-center my-4">
    <ul class="inline-flex items-center -space-x-px text-sm">
        <li>
            <a href="{% if current_page == 1 %}#{% else %}{{ bootstrap_pagination_url }}page=1{% endif %}"
               class="px-3 py-1.5 border border-gray-300 rounded-l bg-white hover:bg-gray-50 {% if current_page == 1 %}opacity-50 pointer-events-none{% endif %}">&laquo;</a>
        </li>
        {% if pages_back %}
            <li><a href="{{ bootstrap_pagination_url }}page={{ pages_back }}" class="px-3 py-1.5 border border-gray-300 bg-white hover:bg-gray-50">&hellip;</a></li>
        {% endif %}
        {% for p in pages_shown %}
            <li>
                <a href="{% if current_page == p %}#{% else %}{{ bootstrap_pagination_url }}page={{ p }}{% endif %}"
                   class="px-3 py-1.5 border border-gray-300 {% if current_page == p %}bg-brand text-white border-brand{% else %}bg-white hover:bg-gray-50{% endif %}">{{ p }}</a>
            </li>
        {% endfor %}
        {% if pages_forward %}
            <li><a href="{{ bootstrap_pagination_url }}page={{ pages_forward }}" class="px-3 py-1.5 border border-gray-300 bg-white hover:bg-gray-50">&hellip;</a></li>
        {% endif %}
        <li>
            <a href="{% if current_page == num_pages %}#{% else %}{{ bootstrap_pagination_url }}page={{ num_pages }}{% endif %}"
               class="px-3 py-1.5 border border-gray-300 rounded-r bg-white hover:bg-gray-50 {% if current_page == num_pages %}opacity-50 pointer-events-none{% endif %}">&raquo;</a>
        </li>
    </ul>
</nav>
{% endwith %}
