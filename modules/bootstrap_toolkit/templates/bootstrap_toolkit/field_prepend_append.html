{% if prepend or append %}
    <div class="flex items-stretch">
        {% if prepend %}<span class="inline-flex items-center px-3 rounded-l border border-r-0 border-gray-300 bg-gray-50 text-sm text-gray-500">{{ prepend }}</span>{% endif %}
        <span class="flex-1 [&>*]:rounded-none {% if prepend %}[&>*]:rounded-r{% endif %} {% if append %}[&>*]:rounded-l{% endif %}">{{ field }}</span>
        {% if append %}<span class="inline-flex items-center px-3 rounded-r border border-l-0 border-gray-300 bg-gray-50 text-sm text-gray-500">{{ append }}</span>{% endif %}
    </div>
{% else %}
    {{ field }}
{% endif %}
