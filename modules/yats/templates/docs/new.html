{% extends "base.html" %}

{% load bootstrap_toolkit i18n %}

{% block title %}{% trans "new document" %}{% endblock %}

{% block extra_head %}
    {{ form.media }}
    <link href="{{ STATIC_URL }}pygments.css" type="text/css" rel="stylesheet" media="all">
{% endblock %}

{% block content %}

    <h2>{% trans "new document" %}</h2>

    <p>&nbsp;</p>

    <form action="" method="post" class="max-w-3xl">
        {% csrf_token %}
        {{ form|as_bootstrap:layout }}
        <div class="mt-4">
            <input type="submit" value="{% trans "save" %}" class="btn btn-primary">
        </div>
    </form>

<script src="{{ STATIC_URL }}js/markdownx-tabs.js" data-edit-label="{% trans 'edit' %}" data-preview-label="{% trans 'preview' %}"></script>
{% endblock %}
