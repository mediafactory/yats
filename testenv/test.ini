; Local test environment config (SQLite, DEBUG on).
; Loaded via YATS_CONFIG by start.sh. Paths are relative to the repo root and
; created by start.sh under testenv/.

[debug]
DEBUG: true
TESTSYTEM: true

[admins]

[database]
DATABASE_ENGINE: django.db.backends.sqlite3
DATABASE_NAME: testenv/data/yats.sqlite
ATOMIC_REQUESTS: True

[mail]
EMAIL_HOST: localhost
EMAIL_PORT: 25
SERVER_EMAIL: dev@localhost
EMAIL_HOST_USER:
EMAIL_HOST_PASSWORD:

[locale]
TIME_ZONE = Europe/Berlin
LANGUAGE_CODE = de

[folder]
STATIC_ROOT = testenv/data/static/
LOGGING_PATH = testenv/data/logs/django_request.log
FILE_UPLOAD_PATH = testenv/data/files/
TEMP_ROOT = testenv/data/tmp/
INDEX_PATH = testenv/data/index/xapian_index

[site]
SECRET_KEY = test-environment-only-not-secret
PROJECT_NAME = YATS-TEST

[github]
GITHUB_REPO = yats
GITHUB_OWNER = mediafactory
GITHUB_USER =
GITHUB_PASS =
